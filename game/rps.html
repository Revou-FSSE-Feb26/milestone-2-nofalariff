<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#050505] text-white flex flex-col items-center justify-center min-h-screen">

    <h1 class="text-3xl font-bold mb-6">Rock Paper Scissors</h1>

    <div class="flex gap-4">
        <button data-choice="rock">✊</button>
        <button data-choice="paper">✋</button>
        <button data-choice="scissors">✌️</button>
    </div>

    <p id="result" class="mt-6"></p>

    <button onclick="window.location.href='../index.html'" class="mt-4 text-gray-400">
        ← Back
    </button>

    <script type="module" src="../js/rps/app.js"></script>
</body>

</html>
